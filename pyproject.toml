[project]
name = "agentic-appointment-system"
version = "0.1.0"
description = "POC for an agentic doctor appointment booking system using LangGraph and MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "langgraph>=0.0.60",
    "langchain>=0.2.1",
    "psycopg2-binary>=2.9.9",
    "mcp>=0.1.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.4",
    "pgvector>=0.2.5",
    "langchain-mcp-adapters>=0.2.2",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "librosa>=0.10.1",
    "av>=12.0.0",
    "pillow>=10.0.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
]
