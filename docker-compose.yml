services:
  db:
    image: ankane/pgvector:v0.7.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medical_clinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Automatically pulls the models on first startup
  ollama-puller:
    image: curlimages/curl
    depends_on:
      - ollama
    entrypoint: [ "sh", "-c", "until curl -s http://ollama:11434/api/tags; do sleep 5; done; echo 'Pulling gemma4:e2b...'; curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"gemma4:e2b\"}'; echo 'Pulling bge-m3...'; curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"bge-m3\"}'" ]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/medical_clinic
      - OLLAMA_BASE_URL=http://ollama:11434
      - WHISPER_MODEL=turbo
      - USE_NATIVE_AUDIO_LLM=true
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ollama
    # No extra_hosts needed now as ollama is in the network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
