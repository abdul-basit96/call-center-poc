# Usage: cp env.docker.template .env  (set HF_TOKEN), then: docker compose up --build
name: medical-appointment-assistant

services:
  db:
    image: ankane/pgvector:v0.7.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medical_clinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_clinic"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in .env — copy env.docker.template and accept google/gemma-4-E2B-it on Hugging Face}
      DATABASE_URL: postgresql://postgres:password@db:5432/medical_clinic
      WHISPER_MODEL: ${WHISPER_MODEL:-turbo}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      USE_NATIVE_AUDIO_LLM: ${USE_NATIVE_AUDIO_LLM:-true}
      HF_DEVICE: ${HF_DEVICE:-cpu}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); assert d.get('models_preloaded') is True\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 1200s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  hf_cache:
